name: Build Roza's World for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --quit

      - name: Export Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          godot --headless --path . --export-release "Windows Desktop" "build/RozasWorld.exe"

      - name: Verify and normalize build
        shell: pwsh
        run: |
          $expected = Join-Path $PWD "build/RozasWorld.exe"
          if (!(Test-Path $expected)) {
            $exe = Get-ChildItem -Path $PWD -Recurse -Filter *.exe -File |
              Where-Object { $_.FullName -notmatch '\\.godot\\' -and $_.Name -notmatch '^godot' } |
              Select-Object -First 1
            if ($null -eq $exe) {
              Write-Host "No executable found. Repository/build tree:"
              Get-ChildItem -Path $PWD -Recurse -File | Select-Object FullName,Length
              throw "Windows executable was not produced."
            }
            Copy-Item $exe.FullName $expected -Force
          }
          Get-Item $expected | Format-List FullName,Length

      - name: Package game
        shell: pwsh
        run: Compress-Archive -Path build/* -DestinationPath RozaWorld-Windows.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RozaWorld-Windows
          path: RozaWorld-Windows.zip
          if-no-files-found: error
