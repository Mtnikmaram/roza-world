name: Build Roza's World for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Ensure Windows export template
        shell: pwsh
        run: |
          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/4.3.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          $template = Join-Path $templateDir "windows_release_x86_64.exe"
          if (!(Test-Path $template)) {
            $zip = Join-Path $env:TEMP "godot_export_templates.tpz"
            Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -OutFile $zip
            $extract = Join-Path $env:TEMP "godot_templates"
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            New-Item -ItemType Directory -Force $extract | Out-Null
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            $found = Get-ChildItem -Path $extract -Recurse -Filter "windows_release_x86_64.exe" -File | Select-Object -First 1
            if ($null -eq $found) { throw "Windows Godot export template was not found in the downloaded template package." }
            Copy-Item $found.FullName $template -Force
          }
          Get-Item $template | Format-List FullName,Length

      - name: Import project
        shell: pwsh
        run: godot --headless --editor --quit --path .

      - name: Export Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Remove-Item -Path build\* -Force -Recurse -ErrorAction SilentlyContinue
          godot --headless --path . --export-release "Windows Desktop" "$PWD\build\RozasWorld.exe"
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed with exit code $LASTEXITCODE" }
          Write-Host "=== BUILD DIRECTORY ==="
          Get-ChildItem -Path build -Recurse -Force | Select-Object FullName,Length

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter *.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Host "No executable produced. Full workspace output follows:"
            Get-ChildItem -Path $PWD -Recurse -Force | Where-Object { $_.FullName -notmatch '\\.godot\\' } | Select-Object FullName,Length
            throw "Windows executable was not produced."
          }
          if ($exe.Length -lt 1000000) { throw "Windows executable is unexpectedly small: $($exe.Length) bytes" }
          Copy-Item $exe.FullName "$PWD\build\RozaWorld.exe" -Force
          Get-Item "$PWD\build\RozaWorld.exe" | Format-List FullName,Length

      - name: Package game
        shell: pwsh
        run: Compress-Archive -Path build\RozaWorld.exe -DestinationPath RozaWorld-Windows.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RozaWorld-Windows
          path: RozaWorld-Windows.zip
          if-no-files-found: error
