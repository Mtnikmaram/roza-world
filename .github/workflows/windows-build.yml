name: Build Roza's World for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Ensure Windows export template
        shell: pwsh
        run: |
          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/4.3.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          $template = Join-Path $templateDir "windows_release_x86_64.exe"
          if (!(Test-Path $template)) {
            $zip = Join-Path $env:TEMP "godot_export_templates.tpz"
            Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -OutFile $zip
            $extract = Join-Path $env:TEMP "godot_templates"
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            New-Item -ItemType Directory -Force $extract | Out-Null
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            $found = Get-ChildItem -Path $extract -Recurse -Filter "windows_release_x86_64.exe" -File | Select-Object -First 1
            if ($null -eq $found) { throw "Windows Godot export template was not found." }
            Copy-Item $found.FullName $template -Force
          }
          Get-Item $template | Format-List FullName,Length

      - name: Validate project
        shell: pwsh
        run: |
          Remove-Item godot-validation.log, godot-console.log -Force -ErrorAction SilentlyContinue
          $godot = (Get-Command godot).Source
          & $godot --headless --editor --quit --path . --verbose --log-file godot-validation.log 2>&1 | Tee-Object -FilePath godot-console.log
          $code = $LASTEXITCODE
          Write-Host "Godot validation exit code: $code"
          if (Test-Path godot-validation.log) { Get-Content godot-validation.log }
          if ($code -ne 0) { throw "Godot project validation failed with exit code $code." }

      - name: Upload Godot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-diagnostics
          path: |
            godot-validation.log
            godot-console.log
          if-no-files-found: ignore

      - name: Build PCK and Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Remove-Item -Path build\* -Force -Recurse -ErrorAction SilentlyContinue
          Remove-Item godot-export.log, godot-export-console.log -Force -ErrorAction SilentlyContinue
          $godot = (Get-Command godot).Source
          & $godot --headless --path . --verbose --log-file godot-export.log --export-pack "Windows Desktop" "$PWD\build\RozaWorld.pck" 2>&1 | Tee-Object -FilePath godot-export-console.log
          $code = $LASTEXITCODE
          Write-Host "Godot export exit code: $code"
          if ($code -ne 0) { throw "Godot PCK export failed with exit code $code." }
          $template = Join-Path $env:APPDATA "Godot/export_templates/4.3.stable/windows_release_x86_64.exe"
          Copy-Item $template "$PWD\build\RozaWorld.exe" -Force
          $exe = Get-Item "$PWD\build\RozaWorld.exe"
          $pck = Get-Item "$PWD\build\RozaWorld.pck"
          Write-Host "EXE: $($exe.Length) bytes"
          Write-Host "PCK: $($pck.Length) bytes"
          if ($exe.Length -lt 1000000) { throw "Windows executable is unexpectedly small." }
          if ($pck.Length -lt 1000) { throw "PCK was not generated correctly." }

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-export-diagnostics
          path: |
            godot-export.log
            godot-export-console.log
          if-no-files-found: ignore

      - name: Package game
        shell: pwsh
        run: |
          Compress-Archive -Path "build\RozaWorld.exe","build\RozaWorld.pck" -DestinationPath "RozaWorld-Windows.zip" -Force
          Get-Item "RozaWorld-Windows.zip" | Format-List FullName,Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RozaWorld-Windows
          path: RozaWorld-Windows.zip
          if-no-files-found: error