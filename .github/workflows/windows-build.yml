name: Build Roza's World for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --quit

      - name: Export Windows
        run: godot --headless --path . --export-release "Windows Desktop" build/RozasWorld.exe

      - name: Verify build
        shell: pwsh
        run: |
          if (!(Test-Path "build/RozasWorld.exe")) { throw "Windows executable was not produced." }
          Get-Item "build/RozasWorld.exe" | Format-List FullName,Length

      - name: Package game
        shell: pwsh
        run: Compress-Archive -Path build/* -DestinationPath RozaWorld-Windows.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RozaWorld-Windows
          path: RozaWorld-Windows.zip
          if-no-files-found: error
